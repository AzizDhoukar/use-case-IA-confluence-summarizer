[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dochealth"
version = "0.1.0"
description = "Confluence documentation health tool: archive triage, duplicates, change suggestions"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "beautifulsoup4>=4.12",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    # Install the CPU-only torch build first to avoid GBs of CUDA wheels (see README).
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25"]

[project.scripts]
dochealth = "dochealth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
