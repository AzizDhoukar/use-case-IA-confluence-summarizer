# Copy to config.yaml and adapt. Paths are relative to this file.

# Spaces to analyze. Use the space KEY (in the URL: /wiki/spaces/<KEY>/...), quoted.
# Personal spaces have keys starting with '~'.
# An entry is either a key (whole space) or a mapping that narrows it to page subtrees:
#   include_pages: page IDs or exact titles; each selects that page + all its descendants
#   exclude_pages: same, removed from the selection
# On the command line: --space CDP --page 12345 [--page "Spécifications"] [--exclude-page ...]
spaces:
  - "TEST"
  # - key: "CDP"
  #   include_pages: ["123456789", "Spécifications fonctionnelles"]
  #   exclude_pages: ["Archives"]

# Never send pages from these spaces, or with these labels, to Claude.
exclude_spaces: []
exclude_labels: [confidential]

database: data/dochealth.sqlite
output_dir: output

report:
  space: TEST
  # Give parent_id, or parent_title (looked up in the report space).
  parent_id: null
  parent_title: "Documentation Health"
  max_rows_per_category: 200

llm:
  claude_bin: claude
  # Hard cap per run, shared by all phases. Pro plan: keep this modest.
  max_calls_per_run: 40
  timeout_seconds: 300
  models:
    classify: haiku    # triage
    compare: sonnet    # duplicates / contradictions
    draft: sonnet      # change suggestions

atlassian:
  page_size: 100
  max_retries: 5

triage:
  # Candidate = not modified for stale_modified_days AND (if analytics available) no views in unread_days.
  stale_modified_days: 540
  unread_days: 365
  use_analytics: auto        # auto | true | false
  analytics_refresh_days: 7  # re-fetch view counts older than this
  max_chars: 6000            # page text sent to Claude is truncated to this
  # Pages matching these are classified historical_record by rule, without an LLM call.
  historical_labels: [meeting-notes, meeting-minutes, retrospective, retro, decision, decisions, decision-log]
  historical_title_patterns:
    - '(?i)\bmeeting notes\b'
    - '(?i)\bretrospective\b'
    - '(?i)\bdecision log\b'
    - '^\d{4}-\d{2}-\d{2}\b'
    - '(?i)\bsprint\b'

embeddings:
  # Runs locally (downloaded once from Hugging Face). Multilingual: French + English.
  # English-only alternative (faster): all-MiniLM-L6-v2
  model: paraphrase-multilingual-MiniLM-L12-v2
  chunk_tokens: 500          # heading-aware chunks of about this size
  batch_size: 32

duplicates:
  # Pages whose embedding similarity is >= threshold are grouped (tune with `dochealth tune-threshold`).
  threshold: 0.85
  max_cluster_size: 5        # bigger groups are split
  min_chars: 300             # ignore near-empty pages (parents, placeholders)
  max_chars_per_page: 4000   # page text sent to Claude per page in a cluster
  tune_thresholds: [0.95, 0.9, 0.85, 0.8, 0.75, 0.7]

jira:
  # Issues matching this JQL and done since the previous run are checked against the docs.
  # Empty = change detection disabled. Do not add a date condition: the tool appends it.
  jql: ""                    # e.g. 'project = CDP AND statusCategory = Done'
  # Date the tool filters on. statusCategoryChangedDate works even when the workflow
  # never sets a resolution (as in CDP); use 'resolved' if your projects set one.
  date_field: statusCategoryChangedDate
  first_run_lookback_days: 30
  page_size: 100

changes:
  # Rule-based prefilter, before any embedding or LLM work (names are case-insensitive).
  skip_subtasks: true
  skip_issue_types: []       # e.g. [Bogue, Retour, "Test intégration"] to keep only stories/evolutions
  skip_statuses: [Abandonnée, Abandonné, Annulé, Annulée, Refusé, Refusée, Cancelled, Canceled, Rejected, "Won't Do"]
  skip_resolutions: ["Won't Do", "Won't Fix", Duplicate, "Cannot Reproduce", Doublon, "Impossible à reproduire", "Non accepté", "Non accepté(e)", Refusé, Refusée, "Non résolue"]
  # Top-k page chunks per issue whose similarity is >= threshold go to Claude (one call per issue).
  # The multilingual model scores most issue/page pairs 0.5-0.75: 0.65 keeps about half.
  similarity_threshold: 0.65
  top_k: 5
  min_confidence: 0.7        # suggestions below this are listed in the report, not posted
  max_comments_per_run: 10
  max_issue_chars: 3000      # issue description sent to Claude is truncated to this
  max_chars_per_excerpt: 2000
